name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          for file in lib/*.js hooks/*.js test.js; do node --check "$file"; done
      - name: Check shell hook syntax
        run: bash -n hooks/post-tool-use.sh
      - name: Run companion behavior tests
        run: node test.js
